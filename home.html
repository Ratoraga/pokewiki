<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
</head>
<body>
    <h1>HOME</h1>

    <div class="profile">
    <img class="thumb">
        <div class="username">
            ...
        </div>
    </div>
    <script>
        async function init() {
            const response = await fetch('/login/user');
            if (!response.ok) {
                alert("Usuario não esta logado");
                window.location.href = "/";
                return;
            }
            const data = await response.json();
            document.querySelector(".profile .username").textContent = data.username;
        }
        init();
    </script>
</body>
</html>
